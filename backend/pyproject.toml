[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Exclude the real-model eval from the default run (no network). Run it with:
#   pytest -m eval -s
addopts = "-m 'not eval'"
markers = [
    "eval: real-model guardrail eval against the labeled dataset (requires a provider key)",
]
